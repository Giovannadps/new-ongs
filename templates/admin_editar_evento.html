<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Editar evento - New ONGs</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="professional-body"><main class="admin-page"><a href="{{ url_for('admin') }}#calendario" class="professional-back">←</a><img src="{{ url_for('static',filename='img/logo.png') }}" class="professional-logo" alt="Logo New ONGs"><h1>Editar evento</h1>{% if erro %}<div class="settings-message">{{ erro }}</div>{% endif %}<form method="POST" class="admin-form-grid admin-edit-form"><input name="titulo" value="{{ evento['titulo'] }}" placeholder="Nome do evento" required><select name="tipo"><option {% if evento['tipo']=='Palestra' %}selected{% endif %}>Palestra</option><option {% if evento['tipo']=='Van da Saúde' %}selected{% endif %}>Van da Saúde</option><option {% if evento['tipo']=='Ação' %}selected{% endif %}>Ação</option><option {% if evento['tipo']=='Evento' %}selected{% endif %}>Evento</option></select><input type="date" name="data_evento" value="{{ evento['data_evento'] }}" required><input type="time" name="horario" value="{{ evento['horario'] or '' }}"><input name="local" value="{{ evento['local'] or '' }}" placeholder="Local"><textarea name="descricao" placeholder="Descrição">{{ evento['descricao'] or '' }}</textarea><button type="submit">Salvar alterações</button></form></main></body></html>
