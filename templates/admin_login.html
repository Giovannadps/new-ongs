<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login administrativo - New ONGs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="home-body {{ acessibilidade_css }}" data-idioma="{{ idioma }}">

    <main class="professional-login-page">

        <a href="/profissional" class="watch-back">
            ←
        </a>

        <div class="professional-login-card">

            <div class="professional-login-logo">
                <img
                    src="{{ url_for('static', filename='img/logo.png') }}"
                    alt="New ONGs"
                >
            </div>

            <h1>
                Login administrativo
            </h1>

            <p>
                Entre com suas credenciais de administrador.
            </p>

            {% if erro %}<p class="form-error">{{ erro }}</p>{% endif %}

            <form method="POST" action="/admin-login">

                <label for="username">
                    Usuário
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Seu usuário"
                    required
                >

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

        </div>

    </main>

<script src="{{ url_for('static', filename='js/idiomas.js') }}"></script></body>

</html>
