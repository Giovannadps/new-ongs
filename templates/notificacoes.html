<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notificações - New ONGs</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="home-body {{ acessibilidade_css }}" data-idioma="{{ idioma }}"><main class="notifications-page"><a href="/home" class="watch-back">←</a><div class="notifications-header"><h1>Notificações</h1><p>Fique por dentro das novidades do New ONGs.</p></div>{% for n in notificacoes %}<section class="notification-card"><div class="notification-icon">🔔</div><div class="notification-content"><span class="notification-label">AVISO</span><h2>{{ n['titulo'] }}</h2><p>{{ n['mensagem'] }}</p><div class="notification-details"><span>📅 {{ n['criado_em'] }}</span></div></div></section>{% else %}<div class="calendar-empty">Nenhuma notificação no momento.</div>{% endfor %}</main><nav class="bottom-navigation"><a href="/home" class="nav-item"><span>⌂</span><small>Home</small></a><a href="{{ url_for('pesquisa') }}" class="nav-item"><span>⌕</span><small>Pesquisa</small></a><a href="{{ url_for('notificacoes') }}" class="nav-item active"><span>♧</span><small>Notificações</small></a><a href="{{ url_for('chat') }}" class="nav-item"><span>♡</span><small>Chat</small></a><a href="{{ url_for('perfil') }}" class="nav-item"><span>○</span><small>Perfil</small></a></nav><script src="{{ url_for('static', filename='js/idiomas.js') }}"></script></body></html>
