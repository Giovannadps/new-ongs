<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ palestra["titulo"] }} - New ONGs</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="watch-body {{ acessibilidade_css }}" data-idioma="{{ idioma }}"><main class="watch-page"><a href="{{ url_for('home') }}" class="watch-back"><span>←</span></a><div class="watch-video"><iframe src="{{ palestra['video_url'] }}" title="{{ palestra['titulo'] }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><section class="watch-info"><span class="watch-category">{{ palestra['categoria'] }}</span><h1>{{ palestra['titulo'] }}</h1><p>{{ palestra['descricao'] }}</p><div class="card-actions"><form method="POST" action="{{ url_for('curtir', palestra_id=palestra['id']) }}"><button type="submit">{{ '♥ Curtido' if curtida else '♡ Curtir' }}</button></form><form method="POST" action="{{ url_for('salvar', palestra_id=palestra['id']) }}"><button type="submit">{{ '🔖 Salvo' if salvo else '🔖 Salvar' }}</button></form></div></section></main><script src="{{ url_for('static', filename='js/idiomas.js') }}"></script></body></html>
