<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - New ONGs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="{{ acessibilidade_css }}" data-idioma="{{ idioma }}">

    <main class="cadastro-page">

        <img
            src="{{ url_for('static', filename='img/logo.png') }}"
            alt="Logo New ONGs"
            class="cadastro-logo"
        >

        <h1>
            Criar conta de usuário
        </h1>

        {% if erro %}<p class="form-error">{{ erro }}</p>{% endif %}

        <form method="POST" action="/cadastro-usuario">

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Nome de usuário"
                required
            >

            <input
                type="email"
                id="email"
                name="email"
                placeholder="E-mail"
                required
            >

            <input
                type="date"
                id="birthdate"
                name="birthdate"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Senha"
                required
            >

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirmar senha"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <a href="/cadastro" class="back-login">
            ← Voltar
        </a>

    </main>

<script src="{{ url_for('static', filename='js/idiomas.js') }}"></script></body>

</html>
