<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro profissional - New ONGs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="profissional-body">

    <main class="cadastro-profissional-page">

        <a href="/cadastro" class="watch-back">
            ←
        </a>


        <div class="cadastro-profissional-header">

            <div class="profissional-logo">
                <img
                    src="{{ url_for('static', filename='img/logo.png') }}"
                    alt="New ONGs"
                >
            </div>

            <div class="cadastro-profissional-icon">
                🩺
            </div>

            <h1>
                Cadastro profissional
            </h1>

            <p>
                Crie sua conta para atuar como profissional
                no New ONGs.
            </p>

        </div>


        <form
            method="POST"
            action="/cadastro-profissional"
            class="cadastro-profissional-form"
        >

            <div class="form-group">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <div class="form-group">

                <label for="especialidade">
                    Especialidade
                </label>

                <input
                    type="text"
                    id="especialidade"
                    name="especialidade"
                    placeholder="Ex.: Psicologia, Enfermagem..."
                    required
                >

            </div>


            <div class="form-group">

                <label for="registro_profissional">
                    Registro profissional
                </label>

                <input
                    type="text"
                    id="registro_profissional"
                    name="registro_profissional"
                    placeholder="Digite seu registro"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crie uma senha"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm-password">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Digite a senha novamente"
                    required
                >

            </div>


            <button type="submit" class="cadastro-profissional-button">
                Criar conta profissional
            </button>

        </form>


        <a href="/cadastro" class="cadastro-profissional-back">
            ← Voltar para escolha de conta
        </a>

    </main>

</body>

</html>
