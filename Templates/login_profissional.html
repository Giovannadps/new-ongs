<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login profissional - New ONGs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="home-body">

    <main class="professional-login-page">

        <a href="/profissional" class="watch-back">
            ←
        </a>

        <div class="professional-login-card">

            <div class="professional-login-logo">

                <img
                    src="{{ url_for('static', filename='img/logo.png') }}"
                    alt="New ONGs"
                >

            </div>

            <h1>
                Login profissional
            </h1>

            <p>
                Entre com suas credenciais profissionais.
            </p>


            <form method="POST">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Seu e-mail"
                    required
                >


                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Sua senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>

            </form>

        </div>

    </main>

</body>

</html>
