<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ palestra["titulo"] }} - New ONGs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="watch-body">

    <main class="watch-page">

        <!-- BOTÃO VOLTAR -->

        <a href="/home" class="watch-back">
            <span>←</span>
        </a>


        <!-- VÍDEO -->

        <div class="watch-video">

            <iframe
                src="{{ palestra['video_url'] }}"
                title="{{ palestra['titulo'] }}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>

        </div>


        <!-- INFORMAÇÕES -->

        <section class="watch-info">

            <span class="watch-category">
                {{ palestra["categoria"] }}
            </span>

            <h1>
                {{ palestra["titulo"] }}
            </h1>

            <p>
                {{ palestra["descricao"] }}
            </p>

        </section>

    </main>

</body>

</html>
